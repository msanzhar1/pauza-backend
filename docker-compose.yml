# Локальная среда разработки. Для production см. README, раздел «Развёртывание».
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pauza
      POSTGRES_PASSWORD: pauza
      POSTGRES_DB: pauza
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pauza"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Очередь зашифрована и живёт ≤ 15 минут, поэтому снимки на диск не нужны.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  migrate:
    build: .
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}

  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  worker:
    build: .
    env_file: .env
    command: ["python", "-m", "pauza.worker"]
    stop_grace_period: 30s
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

volumes:
  pgdata:
