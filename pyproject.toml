[project]
name = "pauza-backend"
version = "0.1.0"
description = "Backend Telegram-бота «Пауза»: проверка сообщений на признаки мошенничества"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "httpx>=0.27",
  "pillow>=10.4",
  "pytesseract>=0.3.10",
  "prometheus-client>=0.20",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "fakeredis[lua]>=2.23",
  "respx>=0.21",
  "aiosqlite>=0.20",
  "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pauza*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E9", "B", "UP", "I"]
ignore = ["UP017", "UP042", "B008"]
